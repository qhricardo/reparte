<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparte - Panel de Repartidores</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --bg: #f8fafc;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 16px; color: #1e293b; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 16px; }
    .hidden { display: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-google { background: #4285F4; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }
    .btn-take { background: var(--success); color: white; margin-top: 12px; }
    .btn-deliver { background: var(--primary); color: white; margin-top: 12px; }
    .btn-logout { background: #ef4444; color: white; width: auto; padding: 6px 12px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-pendiente { background: #fef3c7; color: #92400e; }
    .badge-en_camino { background: #dbeafe; color: #1e40af; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .radar-pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse 1.5s infinite; }
    .comercio-box { background: #f1f5f9; padding: 12px; border-radius: 8px; margin: 8px 0; border-left: 4px solid var(--primary); }
    .alerta-pedido { background: #dcfce7; border: 1px solid #86efac; color: #166534; padding: 10px; border-radius: 8px; margin-bottom: 12px; text-align: center; font-weight: bold; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA 1: LOGIN -->
    <div id="login-view" class="card">
      <h2>🛵 Reparte - Repartidores</h2>
      <p>Inicia sesión con Google para conectarte al radar de pedidos.</p>
      <button class="btn-google" onclick="window.loginWithGoogle()">
        Iniciar Sesión con Google
      </button>
    </div>

    <!-- PANTALLA 2: RADAR Y ENTREGAS -->
    <div id="dashboard-view" class="hidden">
      <div class="card header">
        <div>
          <h3 id="repartidor-name" style="margin:0;">Hola</h3>
          <small id="repartidor-email" style="color:#64748b;"></small>
        </div>
        <button class="btn-logout" onclick="window.logout()">Salir</button>
      </div>

      <div style="display:flex; align-items:center; gap:8px; margin-bottom: 12px;">
        <span class="radar-pulse"></span>
        <h3 style="margin:0;">Radar de Pedidos</h3>
      </div>

      <div id="alerta-ocupado" class="alerta-pedido hidden">
        🚨 Tienes un pedido activo. Entrégalo para poder tomar otro.
      </div>

      <div id="pedidos-container">
        <p style="color:#64748b;">Buscando pedidos cercanos...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jelhlxjbzbegntfyereb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2XGww5rHw0UQ7nvtcODg3A_w_r_hiit";
    
    var supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.supabaseClient = supabaseClient;

    let currentUser = null;

    // METODOS EN AMBITO GLOBAL
    window.loginWithGoogle = async function() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
      if (error) alert("Error al iniciar sesión: " + error.message);
    };

    window.logout = async function() {
      await supabaseClient.auth.signOut();
    };

    window.tomarPedido = async function(pedidoId) {
      // 1. Validar que no tenga ya un pedido activo
      const { data: activos } = await supabaseClient
        .from('pedidos')
        .select('id')
        .eq('repartidor_id', currentUser.id)
        .eq('estado', 'en_camino');

      if (activos && activos.length > 0) {
        alert("⚠️ Ya tienes un pedido en curso. Debes entregarlo antes de tomar otro.");
        return;
      }

      // 2. Tomar el pedido
      const { error } = await supabaseClient
        .from('pedidos')
        .update({
          estado: 'en_camino',
          repartidor_id: currentUser.id
        })
        .eq('id', pedidoId);

      if (error) {
        alert("Error al tomar el pedido: " + error.message);
      } else {
        cargarPedidos();
      }
    };

    window.entregarPedido = async function(pedidoId) {
      const { error } = await supabaseClient
        .from('pedidos')
        .update({ estado: 'entregado' })
        .eq('id', pedidoId)
        .eq('repartidor_id', currentUser.id);

      if (error) {
        alert("Error al marcar como entregado: " + error.message);
      } else {
        cargarPedidos();
      }
    };

    // FUNCIONES DE INTERFAZ Y CONSULTAS
    function showLogin() {
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('dashboard-view').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      
      document.getElementById('repartidor-name').innerText = currentUser.user_metadata?.full_name || 'Repartidor';
      document.getElementById('repartidor-email').innerText = currentUser.email;

      cargarPedidos();
      suscribirRadarEnTiempoReal();
    }

    function formatearHora(fechaIso) {
      if (!fechaIso) return 'Hora desconocida';
      const fecha = new Date(fechaIso);
      return fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    async function cargarPedidos() {
      // Realizamos Join con la tabla 'comercios'
      const { data: pedidos, error } = await supabaseClient
        .from('pedidos')
        .select('*, comercios(*)')
        .or(`estado.eq.pendiente,and(estado.eq.en_camino,repartidor_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error al cargar pedidos:", error);
        return;
      }

      renderizarPedidos(pedidos || []);
    }

    function renderizarPedidos(pedidos) {
      const contenedor = document.getElementById('pedidos-container');
      const alerta = document.getElementById('alerta-ocupado');
      contenedor.innerHTML = '';

      // Verificar si el repartidor ya tiene 1 pedido en camino
      const tienePedidoActivo = pedidos.some(p => p.estado === 'en_camino' && p.repartidor_id === currentUser.id);

      if (tienePedidoActivo) {
        alerta.classList.remove('hidden');
      } else {
        alerta.classList.add('hidden');
      }

      if (pedidos.length === 0) {
        contenedor.innerHTML = '<div class="card"><p style="color:#64748b; margin:0;">No hay pedidos pendientes en los comercios.</p></div>';
        return;
      }

      pedidos.forEach(pedido => {
        // Ocultar pedidos 'pendientes' de la lista si ya estoy entregando uno
        if (tienePedidoActivo && pedido.estado === 'pendiente') {
          return; 
        }

        const card = document.createElement('div');
        card.className = 'card';

        const esMio = pedido.repartidor_id === currentUser.id;
        let estadoBadge = pedido.estado || 'pendiente';
        let botonAccion = '';

        if (estadoBadge === 'pendiente') {
          if (!tienePedidoActivo) {
            botonAccion = `<button class="btn-take" onclick="window.tomarPedido('${pedido.id}')">Tomar Pedido</button>`;
          }
        } else if (estadoBadge === 'en_camino' && esMio) {
          botonAccion = `<button class="btn-deliver" onclick="window.entregarPedido('${pedido.id}')">Marcar como Entregado</button>`;
        }

        const datosComercio = pedido.comercios || {};
        const horaPedido = formatearHora(pedido.created_at);

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <span style="font-size:13px; color:#64748b; font-weight:bold;">🕒 Hora: ${horaPedido}</span>
            <span class="badge badge-${estadoBadge}">${estadoBadge.replace('_', ' ')}</span>
          </div>

          <div class="comercio-box">
            <h4 style="margin:0 0 4px 0; color:#1e293b;">🏪 ${datosComercio.nombre || pedido.comercio_nombre || 'Comercio'}</h4>
            <p style="margin:2px 0; font-size:14px;"><strong>📍 Recoger en:</strong> ${datosComercio.direccion || 'Dirección de comercio no disponible'}</p>
            <p style="margin:2px 0; font-size:14px;"><strong>📞 Teléfono Comercio:</strong> ${datosComercio.telefono || 'Sin teléfono'}</p>
          </div>

          <p style="margin: 6px 0;"><strong>📦 Producto(s):</strong> ${pedido.producto_nombre || 'Producto sin nombre'}</p>
          <p style="margin: 4px 0;"><strong>👤 Cliente:</strong> ${pedido.cliente_nombre || 'No especificado'}</p>
          <p style="margin: 4px 0;"><strong>🏠 Dirección de entrega:</strong> ${pedido.direccion_entrega || 'Sin dirección'}</p>
          <p style="margin: 4px 0;"><strong>📱 Teléfono Cliente:</strong> ${pedido.telefono_cliente || pedido.telefono || 'Sin teléfono'}</p>
          <p style="margin: 6px 0; font-size: 16px; color: var(--success);"><strong>💵 Precio / Cobro:</strong> $${pedido.precio || '0.00'}</p>
          
          ${botonAccion}
        `;
        contenedor.appendChild(card);
      });
    }

    function suscribirRadarEnTiempoReal() {
      supabaseClient
        .channel('radar-pedidos')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
          cargarPedidos();
        })
        .subscribe();
    }

    // LISTENER DE SESIÓN
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        showDashboard();
      } else {
        showLogin();
      }

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
          currentUser = session.user;
          showDashboard();
        } else if (event === 'SIGNED_OUT') {
          currentUser = null;
          showLogin();
        }
      });
    });
  </script>
</body>
</html>
