<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos y Radar</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; }
        .oculto { display: none !important; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        .tarjeta-producto { background: white; border-radius: 8px; padding: 12px; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px; display: inline-block; vertical-align: top; }
        .tarjeta-producto img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .badge-estado { padding: 4px 8px; border-radius: 12px; font-size: 11px; text-transform: uppercase; font-weight: bold; color: white; }
        .estado-pendiente { background-color: #f39c12; }
        .estado-asignado { background-color: #3498db; }
        .estado-en_camino { background-color: #9b59b6; }
        .estado-entregado { background-color: #2ecc71; }
        .notificacion-toast { position: fixed; top: 20px; right: 20px; background-color: #2ecc71; color: white; padding: 16px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 9999; font-weight: bold; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- VISTA GENERAL / CLIENTE -->
    <div id="pantallaCliente">
        <h2>🛍️ Realizar Pedido</h2>
        <div style="margin-bottom: 15px;">
            <input type="text" id="direccionEscrita" placeholder="Dirección de entrega" style="padding: 8px; width: 250px;">
            <input type="tel" id="telefonoCliente" placeholder="Teléfono de contacto" style="padding: 8px; width: 180px;">
        </div>
        <p>Costo de envío: $<span id="txtCostoEnvio">25.00</span></p>
        <button id="btnEnviarPedidoFinal" class="btn btn-success" onclick="procesarPedidoFinal()">Enviar Pedido al Radar</button>
    </div>

    <hr>

    <!-- PANEL DEL DUEÑO DE COMERCIO -->
    <div id="pantallaDuenio">
        <h2 id="nombreComercioDuenio">🏬 Cargando Comercio...</h2>
        <p id="infoComercioDuenio" style="color: #555;"></p>
        <button class="btn btn-danger" onclick="eliminarMiComercio()">Eliminar Comercio</button>

        <h3>📥 Pedidos Recibidos (Tiempo Real)</h3>
        <div id="listaPedidosRecibidos" style="max-width: 500px;">
            <p style="color:#7f8c8d;">Aún no hay pedidos recibidos.</p>
        </div>

        <h3>📦 Gestión de Productos</h3>
        <form id="formProducto" style="background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin-bottom: 20px;">
            <div style="margin-bottom: 10px;">
                <label>Nombre:</label><br>
                <input type="text" id="prodNombre" required style="width: 100%; padding: 6px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Precio:</label><br>
                <input type="number" step="0.01" id="prodPrecio" required style="width: 100%; padding: 6px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Descripción:</label><br>
                <textarea id="prodDescripcion" style="width: 100%; padding: 6px;"></textarea>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Imagen:</label><br>
                <input type="file" id="prodImagenArchivo" accept="image/*" required>
            </div>
            <button type="submit" id="btnGuardarProducto" class="btn btn-primary">Publicar Producto</button>
        </form>

        <div id="listaProductosDuenio"></div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Sustituye con tus credenciales)
        const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
        const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ESTADOS GLOBALES MOCK / CONTEXTO DE SESIÓN
        let usuarioActual = {
            email: 'cliente@ejemplo.com',
            user_metadata: { full_name: 'Ricardo Quintero' }
        };
        let carrito = [{ nombre: 'Hamburguesa Doble', precio: 120.00, cantidad: 1 }];
        let coordsEntrega = { lat: 19.432608, lng: -99.133209 };
        let comercioSeleccionadoObjeto = { id: 'comercio-123-uuid', nombre: 'Pizzeria Central' };
        let miComercio = { id: 'comercio-123-uuid', nombre: 'Pizzeria Central', direccion: 'Av. Principal #45', horario: '09:00 AM - 10:00 PM' };

        // FUNCIONES DE APOYO
        function obtenerCoordsComercioActivo() {
            return { lat: 19.430000, lng: -99.130000 };
        }

        function actualizarBarraCarrito() {}
        function cerrarModalCheckout() {}
        function ocultarTodasLasPantallas() {}

        async function verificarSiEsDuenio() {
            if (!miComercio) {
                document.getElementById('pantallaDuenio').classList.add('oculto');
            }
        }

        // PROCESAR PEDIDO Y VINCULAR CON EL RADAR DE REPARTIDORES
        async function procesarPedidoFinal() {
            const direccionText = document.getElementById('direccionEscrita').value;
            const telefonoText = document.getElementById('telefonoCliente').value;

            // Validaciones de entrada
            if (!direccionText.trim()) return alert("Ingresa tu dirección de entrega.");
            if (!telefonoText.trim()) return alert("Ingresa tu teléfono de contacto para el repartidor.");

            const btn = document.getElementById('btnEnviarPedidoFinal');
            btn.disabled = true;

            const subtotal = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const costoEnvio = parseFloat(document.getElementById('txtCostoEnvio').innerText) || 0;
            const totalFinal = subtotal + costoEnvio;
            const resumenProductos = carrito.map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
            
            const coordsComercio = obtenerCoordsComercioActivo();

            // Obtener el nombre del usuario o usar el correo como alternativa
            const nombreCliente = usuarioActual?.user_metadata?.full_name 
              || usuarioActual?.user_metadata?.name 
              || usuarioActual?.email?.split('@')[0] 
              || usuarioActual?.email;

            // Estructura completa enviada a Supabase
            const payloadPedido = {
                cliente_nombre: nombreCliente,
                cliente_email: usuarioActual?.email || null,
                telefono_cliente: telefonoText.trim(),
                direccion_entrega: `${direccionText} (GPS: ${coordsEntrega.lat.toFixed(6)}, ${coordsEntrega.lng.toFixed(6)})`,
                producto_nombre: resumenProductos,
                precio: totalFinal,
                comercio_id: comercioSeleccionadoObjeto.id,
                comercio_nombre: comercioSeleccionadoObjeto.nombre,
                // Coordenadas estructuradas para el Radar de Repartidores
                lat_origen: coordsComercio.lat,
                lng_origen: coordsComercio.lng,
                lat_destino: coordsEntrega.lat,
                lng_destino: coordsEntrega.lng,
                estado: 'pendiente' // Crucial: Permite que aparezca en el radar del repartidor
            };

            const { error } = await supabaseClient.from('pedidos').insert([payloadPedido]);

            if (error) {
                alert("Error al enviar el pedido: " + error.message);
            } else {
                alert("¡Pedido enviado con éxito! Aparecerá en el radar de repartidores en breve.");
                carrito = [];
                actualizarBarraCarrito();
                cerrarModalCheckout();
            }
            
            btn.disabled = false;
        }

        // PANEL DE DUEÑO, HORA DE PEDIDO Y REFRESH DE ESTADOS
        async function cargarPanelDuenio() {
            if (!miComercio) return;
            document.getElementById('nombreComercioDuenio').innerText = `🏬 ${miComercio.nombre}`;
            document.getElementById('infoComercioDuenio').innerText = `Dirección: ${miComercio.direccion || 'N/A'} | Horario: ${miComercio.horario || 'N/A'}`;
            cargarProductosDuenio();
            activarEscuchaPedidosEnTiempoReal();
        }

        window.eliminarMiComercio = async function() {
            if (!miComercio) return;
            if (confirm("⚠️ ¿Deseas ELIMINAR tu comercio por completo y todos sus productos?")) {
                try {
                    await supabaseClient.from('productos').delete().eq('comercio_id', miComercio.id);
                    const { error } = await supabaseClient.from('comercios').delete().eq('id', miComercio.id);
                    if (error) throw error;
                    alert("Tu comercio ha sido eliminado.");
                    miComercio = null;
                    await verificarSiEsDuenio();
                } catch (err) {
                    alert("Error: " + err.message);
                }
            }
        };

        function formatearFechaHora(fechaIso) {
            if (!fechaIso) return 'Reciente';
            const fecha = new Date(fechaIso);
            return fecha.toLocaleString('es-MX', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true,
                day: '2-digit',
                month: 'short'
            });
        }

        function obtenerClaseEstado(estado) {
            switch(estado) {
                case 'pendiente': return 'estado-pendiente';
                case 'asignado': return 'estado-asignado';
                case 'en_camino': return 'estado-en_camino';
                case 'entregado': return 'estado-entregado';
                default: return 'estado-pendiente';
            }
        }

        function activarEscuchaPedidosEnTiempoReal() {
            if (!miComercio) return;
            cargarPedidosInicialesDuenio();

            // Suscripción en Tiempo Real para nuevos pedidos o actualizaciones de estado por parte de repartidores
            supabaseClient
                .channel('pedidos_en_vivo')
                .on('postgres_changes', {
                    event: '*', // Escucha INSERTs y UPDATEs
                    schema: 'public',
                    table: 'pedidos',
                    filter: `comercio_id=eq.${miComercio.id}`
                }, payload => {
                    if (payload.eventType === 'INSERT') {
                        lanzarNotificacionDuenio(payload.new);
                    }
                    cargarPedidosInicialesDuenio();
                })
                .subscribe();
        }

        async function cargarPedidosInicialesDuenio() {
            if (!miComercio) return;
            const { data: pedidos } = await supabaseClient
                .from('pedidos')
                .select('*')
                .eq('comercio_id', miComercio.id)
                .order('created_at', { ascending: false });

            const cont = document.getElementById('listaPedidosRecibidos');
            if (!pedidos || pedidos.length === 0) {
                cont.innerHTML = "<p style='color:#7f8c8d;'>Aún no hay pedidos recibidos.</p>";
                return;
            }

            cont.innerHTML = pedidos.map(p => {
                const horaFormateada = formatearFechaHora(p.created_at);
                const estadoTexto = (p.estado || 'pendiente').replace('_', ' ');
                const claseEstado = obtenerClaseEstado(p.estado);

                return `
                    <div style="background: #f8f9fa; padding: 12px; border-left: 4px solid #27ae60; margin-bottom: 10px; border-radius: 4px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span class="badge-estado ${claseEstado}">${estadoTexto}</span>
                            <span style="font-size: 12px; color: #7f8c8d; font-weight: bold;">🕒 ${horaFormateada}</span>
                        </div>
                        <p style="margin:2px 0;"><b>Cliente:</b> ${p.cliente_nombre}</p>
                        <p style="margin:2px 0;"><b>Teléfono:</b> ${p.telefono_cliente || 'N/A'}</p>
                        <p style="margin:2px 0;"><b>Productos:</b> ${p.producto_nombre}</p>
                        <p style="margin:2px 0;"><b>Ubicación:</b> ${p.direccion_entrega}</p>
                        <p style="margin:2px 0; color:#27ae60;"><b>Total:</b> $${Number(p.precio).toFixed(2)}</p>
                    </div>
                `;
            }).join('');
        }

        function lanzarNotificacionDuenio(nuevoPedido) {
            const toast = document.createElement('div');
            toast.className = 'notificacion-toast';
            toast.innerHTML = `🔔 ¡Nuevo Pedido de $${Number(nuevoPedido.precio).toFixed(2)}!`;
            document.body.appendChild(toast);

            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(() => {});

            setTimeout(() => toast.remove(), 5000);
        }

        async function cargarProductosDuenio() {
            if (!miComercio) return;
            const { data: productos } = await supabaseClient
                .from('productos')
                .select('*')
                .eq('comercio_id', miComercio.id);

            const lista = document.getElementById('listaProductosDuenio');
            lista.innerHTML = "";

            if (!productos || productos.length === 0) {
                lista.innerHTML = "<p>Aún no has publicado productos.</p>";
                return;
            }

            productos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'tarjeta-producto';
                card.innerHTML = `
                    <img src="${p.imagen}" alt="${p.nombre}">
                    <div class="info-producto">
                        <h4>${p.nombre}</h4>
                        <div class="precio">$${Number(p.precio).toFixed(2)}</div>
                        <button class="btn btn-danger" style="width:100%; margin-top:8px;" onclick="eliminarProducto('${p.id}')">Eliminar</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        document.getElementById('formProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnGuardar = document.getElementById('btnGuardarProducto');
            const archivo = document.getElementById('prodImagenArchivo').files[0];

            if (!archivo) return alert("Selecciona una imagen.");

            try {
                btnGuardar.disabled = true;
                btnGuardar.innerText = "Subiendo imagen...";

                const extension = archivo.name.split('.').pop();
                const nombreArchivo = `${miComercio.id}/${Date.now()}.${extension}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('productos')
                    .upload(nombreArchivo, archivo);

                if (uploadError) throw uploadError;

                const { data: publicUrlData } = supabaseClient.storage
                    .from('productos')
                    .getPublicUrl(nombreArchivo);

                const producto = {
                    comercio_id: miComercio.id,
                    nombre: document.getElementById('prodNombre').value,
                    precio: parseFloat(document.getElementById('prodPrecio').value),
                    descripcion: document.getElementById('prodDescripcion').value,
                    imagen: publicUrlData.publicUrl
                };

                await supabaseClient.from('productos').insert([producto]);
                document.getElementById('formProducto').reset();
                cargarProductosDuenio();
            } catch (err) {
                alert(err.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerText = "Publicar Producto";
            }
        });

        window.eliminarProducto = async function(id) {
            if (confirm("¿Eliminar este producto?")) {
                await supabaseClient.from('productos').delete().eq('id', id);
                cargarProductosDuenio();
            }
        };

        // Inicializar panel de dueño en carga
        window.addEventListener('DOMContentLoaded', () => {
            cargarPanelDuenio();
        });
    </script>
</body>
</html>
